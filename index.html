<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luminous Dental Clinic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap');

  :root{
    --cream:#f4efe6;
    --cream-deep:#ece4d4;
    --ink:#1c1a17;
    --gold:#b9903f;
    --gold-soft:#d9bd80;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, #fbf8f2 0%, var(--cream) 45%, var(--cream-deep) 100%);
    font-family:'Jost', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .card{
    width:100%;
    max-width:420px;
    text-align:center;
  }

  .logo-ring{
    width:132px;
    height:132px;
    margin:0 auto 22px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--gold-soft);
    box-shadow:0 0 0 6px rgba(255,255,255,0.5), 0 18px 40px -18px rgba(28,26,23,0.35);
  }
  .logo-ring img{width:100%; height:100%; object-fit:cover; display:block;}

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:34px;
    letter-spacing:0.08em;
    color:var(--ink);
  }

  .sub{
    margin-top:6px;
    font-size:12px;
    letter-spacing:0.32em;
    font-weight:400;
    color:var(--gold);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .sub::before, .sub::after{
    content:"";
    height:1px;
    width:26px;
    background:var(--gold-soft);
  }

  .tagline{
    margin-top:18px;
    font-size:13.5px;
    letter-spacing:0.02em;
    line-height:1.7;
    color:#5c564c;
    font-weight:300;
  }

  nav{
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:13px;
  }

  a.link{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(185,144,63,0.35);
    border-radius:2px;
    text-decoration:none;
    color:var(--ink);
    letter-spacing:0.06em;
    font-size:14.5px;
    font-weight:400;
    text-transform:uppercase;
    overflow:hidden;
    transition:border-color .35s ease, background .35s ease, transform .25s ease;
  }
  a.link:active{ transform:scale(0.985); }

  a.link::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:var(--gold);
    transform:scaleY(0);
    transform-origin:bottom;
    transition:transform .4s ease;
  }
  a.link:hover{
    border-color:var(--gold);
    background:rgba(255,255,255,0.85);
  }
  a.link:hover::before{ transform:scaleY(1); }

  .icon{
    width:19px; height:19px; flex:none;
    stroke:var(--gold);
    fill:none;
    stroke-width:1.5;
  }

  .label{flex:1; text-align:left;}
  .label small{
    display:block;
    font-family:'Jost', sans-serif;
    font-size:10px;
    letter-spacing:0.08em;
    color:#a09985;
    text-transform:none;
    margin-top:2px;
  }

  .arrow{
    font-size:14px;
    color:var(--gold-soft);
    transition:transform .3s ease;
  }
  a.link:hover .arrow{ transform:translateX(4px); color:var(--gold); }

  footer{
    margin-top:38px;
    font-size:10.5px;
    letter-spacing:0.15em;
    color:#a89f8b;
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    a.link, a.link::before, .arrow{ transition:none; }
  }
</style>
</head>
